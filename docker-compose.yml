# Local development stack: the two application containers, plus the Shopify CLI. Vercel +
# Supabase stay the deployed target (plan.md Phase 4), and the *same* Supabase project is
# used locally, so there is one database everywhere and no local-only branch in the app.
#
#   docker compose up --build               # API + dashboard
#   docker compose run --rm shopify version # Shopify CLI (tools profile)
#
# Why there is no database container: the data layer is node-postgres over the Supabase
# pooler (decision 2026-09-20, task.md assumption 10), reading the standard libpq `PG*`
# variables from backend/.env — the same contract `psql` and `pg_dump` use, so the app, a
# manual query and the seed artifacts share one credential. Nothing speaks the
# `/rest/v1/<table>` route that a local PostgREST + nginx pair existed to reproduce for
# supabase-js, so that pair, the `db` service behind it and docker/postgrest/ are gone.

name: price-sync

services:
  # ------------------------------------------------------------------- Applications
  backend:
    build: ./backend
    working_dir: /app
    # Runs the install so a fresh clone needs nothing but Docker; `exec` keeps npm as
    # PID 1 so compose can stop the container with a signal instead of a SIGKILL.
    command: ["sh", "-c", "npm install --no-audit --no-fund && exec npm run dev"]
    # The database is not containerized: .env carries the `PG*` values for the Supabase
    # pooler, which resolves over IPv4 and is reachable from here exactly as it is from
    # Vercel. Nothing in this file needs to be secret, and nothing here overrides them.
    env_file:
      - path: ./backend/.env
        required: false # a fresh clone has no .env yet; config.js fails fast on the gaps
    environment:
      HOME: /tmp # npm's cache must be writable by the non-root uid below
      npm_config_cache: /tmp/.npm-cache
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}" # see .env.example — keeps files in ./backend yours
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && exec npm run dev"]
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0 # bind all interfaces, or the published port reaches nothing
      # Browser-side calls leave the container, so they use the published port.
      # Server components run inside it and must use API_URL (the host name is not
      # resolvable there) — set both in T-2.2.
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_URL: http://backend:3000
      HOME: /tmp
      npm_config_cache: /tmp/.npm-cache
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  # ------------------------------------------------------------------ Optional tools
  # Not started by `up` — only `docker compose run --rm shopify ...`. The CLI covers the
  # manual steps: `store execute` runs Admin API GraphQL (product seeding, the T-0.9
  # variant lookup), `store auth` issues a token, `store graphiql` opens a UI. The sync
  # itself needs a permanent custom-app token in backend/.env, not this one.
  #   docker compose run --rm shopify store auth --store <store>.myshopify.com \
  #     --scopes read_products,write_products
  #
  # network_mode: host is what makes `store auth` work at all. The CLI hardcodes its
  # OAuth callback as http://127.0.0.1:13387/auth/callback (dist/index.js:
  # `var Gr=13387, ot="/auth/callback"`) and binds that exact port to 127.0.0.1 as well
  # (`listen(13387, "127.0.0.1")`). On the default bridge network that loopback is the
  # container's own, so the browser here can never deliver the code and the command sits
  # at "will open the app authorization page" until it times out. Publishing a port
  # cannot fix it: Docker forwards to the container's eth0 address, which a
  # loopback-bound socket refuses. Verified both ways — bridge: `curl 127.0.0.1:13387` on
  # the host is refused; host: the same curl reaches the CLI and gets an HTTP 400 for a
  # bad `state`. Host networking is Linux-only, so where it is unavailable run only
  # `store auth` on the host. `auth login` needs no callback and works either way.
  # `ports:` is mutually exclusive with network_mode: host, hence its absence.
  shopify:
    profiles: [tools]
    build: ./tools
    working_dir: /work
    entrypoint: ["shopify"]
    network_mode: host
    environment:
      # The CLI "stores an online access token for later reuse", so it must outlive the
      # container — a named volume, not /tmp, or every command needs re-authenticating.
      HOME: /home/shopify
    volumes:
      - ./:/work # so --output-file results land in the repo, not inside the container
      - shopify_config:/home/shopify

volumes:
  shopify_config:

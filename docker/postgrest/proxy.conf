# supabase-js always requests <SUPABASE_URL>/rest/v1/<table>, mirroring Supabase's Kong
# gateway, and PostgREST serves tables at its root with no base-path option. Strip the
# prefix here so the application code needs no local-only branch.
server {
    listen 80;

    # OpenAPI document for a bare /rest/v1 (schema check, T-0.11/T-0.12).
    location = /rest/v1 {
        proxy_pass http://postgrest:3000/;
    }

    # Table routes: /rest/v1/products -> http://postgrest:3000/products
    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
    }
}
